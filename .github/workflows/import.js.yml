name: Import

on:
  workflow_dispatch:
env:
  GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
  RAFL_SHEET_ID: ${{ vars.RAFL_SHEET_ID }}
  
defaults:
  run:
    working-directory: apps/web

jobs:
  deploy:
    # Migration hold: live import/upload requires a separately approved release.
    if: ${{ false }}
    name: Import
    permissions:
      contents: write
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Import
        run: npm run import

      # Commit all changed files back to the repository
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Automated commit after import"
          commit_options: '--no-verify'
          file_pattern: 'apps/web/src/data/*'

