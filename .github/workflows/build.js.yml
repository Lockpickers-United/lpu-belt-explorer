name: Build-N-Deploy

concurrency:
  group: site-and-classification-catalog
  cancel-in-progress: false

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - 'apps/web/scripts/**'
      - 'apps/web/index.html'
      - 'apps/web/package.json'
      - 'apps/web/vite.config.js'
      - '.env.*'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.npmrc'
      - '.github/workflows/build.js.yml'
  workflow_run:
    workflows: [Import]
    types:
      - completed
  workflow_dispatch:
    inputs:
      classification_write_stage:
        description: Classification frontend write stage for this manual release
        required: true
        type: choice
        default: read
        options:
          - read
          - publish

defaults:
  run:
    working-directory: apps/web

jobs:
  deploy:
    # Migration hold: Phase 5 must restore a main-only release condition,
    # accepting workflow_run only after a successful main-branch Import.
    if: ${{ false }}
    name: Build-N-Deploy
    environment: github-pages
    permissions:
      contents: write
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
  
      - name: Install dependencies
        working-directory: .
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          npm ci
      - name: Validate catalog deployment configuration
        shell: bash
        env:
          SFTP_HOST: ${{ vars.SFTP_HOST }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
          SFTP_USER: ${{ vars.SFTP_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_ROOT_DEV: ${{ vars.DEPLOY_ROOT_DEV }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for variable in SFTP_HOST SFTP_PORT SFTP_USER DEPLOY_ROOT DEPLOY_ROOT_DEV SFTP_PRIVATE_KEY SFTP_KNOWN_HOSTS; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing github-pages environment value: $variable" >&2
              exit 1
            fi
          done
          [[ "$SFTP_HOST" =~ ^[a-zA-Z0-9._-]+$ ]] || exit 1
          [[ "$SFTP_PORT" =~ ^[0-9]+$ ]] || exit 1
          [[ "$SFTP_USER" =~ ^[a-zA-Z0-9._-]+$ ]] || exit 1
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9._/-]+$ && "$DEPLOY_ROOT" != *".."* ]] || exit 1
          [[ "$DEPLOY_ROOT_DEV" =~ ^/[a-zA-Z0-9._/-]+$ && "$DEPLOY_ROOT_DEV" != *".."* ]] || exit 1
          [[ "$DEPLOY_ROOT" != "$DEPLOY_ROOT_DEV" ]] || exit 1
# disbabled, runs pre-commit
#      - name: Run tests
#        run: npm run test:ci
      - name: Build and Deploy
        run: npm run ci-build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_REDDIT_CLIENT_SECRET: ${{ vars.VITE_REDDIT_CLIENT_SECRET }}
          # Manual releases choose their stage; automatic releases retain the environment setting.
          VITE_CLASSIFICATION_WRITE_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.classification_write_stage || vars.VITE_CLASSIFICATION_WRITE_STAGE || 'read' }}

      - name: Verify paired catalog artifacts
        run: node scripts/validateClassificationCatalog.js dist/data.json dist/classification-catalog.json

      - name: Configure catalog SSH host verification
        shell: bash
        env:
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/catalog-ssh"
          printf '%s\n' "$SFTP_PRIVATE_KEY" > "$RUNNER_TEMP/catalog-ssh/private_key"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$RUNNER_TEMP/catalog-ssh/known_hosts"

      - name: Prepare remote catalog directory
        shell: bash
        env:
          SFTP_HOST: ${{ vars.SFTP_HOST }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
          SFTP_USER: ${{ vars.SFTP_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_ROOT_DEV: ${{ vars.DEPLOY_ROOT_DEV }}
        run: |
          set -euo pipefail
          for deploy_root in "$DEPLOY_ROOT" "$DEPLOY_ROOT_DEV"; do
            ssh -i "$RUNNER_TEMP/catalog-ssh/private_key" -p "$SFTP_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/catalog-ssh/known_hosts" \
              "$SFTP_USER@$SFTP_HOST" "mkdir -p '$deploy_root/shared/snapshots'"
          done

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/dist

      - name: Upload catalog snapshots
        shell: bash
        env:
          SFTP_HOST: ${{ vars.SFTP_HOST }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
          SFTP_USER: ${{ vars.SFTP_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_ROOT_DEV: ${{ vars.DEPLOY_ROOT_DEV }}
        run: |
          set -euo pipefail
          for deploy_root in "$DEPLOY_ROOT" "$DEPLOY_ROOT_DEV"; do
            for filename in awards.json data.json safelocks.json glossary.json projects.json rafl.json classification-catalog.json; do
              temporary_name=".$filename.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.tmp"
              source_file="dist/$filename"
              if [[ "$filename" == safelocks.json ]]; then
                source_file=src/data/safelocks.json
              fi
              printf 'put "%s" "%s"\n' \
                "$PWD/$source_file" \
                "$deploy_root/shared/snapshots/$temporary_name"
            done
          done > "$RUNNER_TEMP/catalog-sftp-batch"
          sftp -b "$RUNNER_TEMP/catalog-sftp-batch" \
            -i "$RUNNER_TEMP/catalog-ssh/private_key" -P "$SFTP_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/catalog-ssh/known_hosts" \
            "$SFTP_USER@$SFTP_HOST"

      - name: Verify and activate catalog snapshots
        shell: bash
        env:
          SFTP_HOST: ${{ vars.SFTP_HOST }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
          SFTP_USER: ${{ vars.SFTP_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_ROOT_DEV: ${{ vars.DEPLOY_ROOT_DEV }}
        run: |
          set -euo pipefail
          for deploy_root in "$DEPLOY_ROOT" "$DEPLOY_ROOT_DEV"; do
            for filename in awards.json data.json safelocks.json glossary.json projects.json rafl.json classification-catalog.json; do
              temporary_name=".$filename.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.tmp"
              source_file="dist/$filename"
              if [[ "$filename" == safelocks.json ]]; then
                source_file=src/data/safelocks.json
              fi
              expected_sha=$(sha256sum "$source_file")
              expected_sha=${expected_sha%% *}
              ssh -i "$RUNNER_TEMP/catalog-ssh/private_key" -p "$SFTP_PORT" \
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o "UserKnownHostsFile=$RUNNER_TEMP/catalog-ssh/known_hosts" \
                "$SFTP_USER@$SFTP_HOST" \
                "bash -s -- '$deploy_root/shared/snapshots' '$temporary_name' '$expected_sha'" \
                < scripts/activateClassificationCatalog.sh
            done
          done
          
