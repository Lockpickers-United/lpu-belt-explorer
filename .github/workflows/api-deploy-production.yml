name: API deploy production (migration hold)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm the production deployment
        required: true
        type: choice
        options:
          - deploy-production

permissions:
  contents: read

concurrency:
  group: api-production-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/api

jobs:
  verify:
    name: Test deployment commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the main branch
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployments must run from main." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --ignore-scripts
          npm ci --ignore-scripts

      - name: Run validation
        working-directory: .
        run: npm run validate:api

  deploy:
    # Phase 5 must explicitly remove this hold after old release authority is disabled.
    if: ${{ false }}
    name: Upload and activate release
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.HEALTHCHECK_URL }}
    env:
      SFTP_HOST: ${{ vars.SFTP_HOST }}
      SFTP_PORT: ${{ vars.SFTP_PORT }}
      SFTP_USER: ${{ vars.SFTP_USER }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      REMOTE_NODE_BIN: ${{ vars.REMOTE_NODE_BIN }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
      SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
      SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SFTP_HOST SFTP_PORT SFTP_USER DEPLOY_ROOT REMOTE_NODE_BIN
            PM2_APP_NAME HEALTHCHECK_URL SFTP_PRIVATE_KEY SFTP_KNOWN_HOSTS
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing GitHub production environment value: $variable" >&2
              exit 1
            fi
          done

          [[ "$SFTP_HOST" =~ ^[a-zA-Z0-9._-]+$ ]] || exit 1
          [[ "$SFTP_PORT" =~ ^[0-9]+$ ]] || exit 1
          [[ "$SFTP_USER" =~ ^[a-zA-Z0-9._-]+$ ]] || exit 1
          [[ "$PM2_APP_NAME" =~ ^[a-zA-Z0-9._-]+$ ]] || exit 1
          [[ "$PM2_APP_NAME" == "lpubelts-api-server-prod-next" ]] || {
            echo "PM2_APP_NAME must match ecosystem.prod.json." >&2
            exit 1
          }
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9._/-]+$ ]] || exit 1
          [[ "$REMOTE_NODE_BIN" =~ ^/[a-zA-Z0-9._/-]+$ ]] || exit 1
          [[ "$DEPLOY_ROOT" != "/" && "$DEPLOY_ROOT" != *".."* ]] || exit 1
          [[ "$REMOTE_NODE_BIN" != "/" && "$REMOTE_NODE_BIN" != *".."* ]] || exit 1
          [[ "$HEALTHCHECK_URL" =~ ^https://[a-zA-Z0-9._:-]+/[a-zA-Z0-9._/-]*$ ]] || exit 1

      - name: Set up Node.js for the release package
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install production dependencies on the runner
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --ignore-scripts
          npm ci --workspace=apps/api --omit=dev --include-workspace-root=false --ignore-scripts
          cd apps/api
          node -e "import('sharp')"

      - name: Configure SSH host verification
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SFTP_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/private_key"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"

      - name: Package tracked files
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$RELEASE_ID.tar.gz"
          node scripts/releaseArtifact.js create "$GITHUB_SHA" "$archive"
          node scripts/releaseArtifact.js inspect "$archive"

      - name: Prepare remote upload directory
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$RUNNER_TEMP/deploy-ssh/private_key"
            -p "$SFTP_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$SFTP_USER@$SFTP_HOST" \
            "mkdir -p '$DEPLOY_ROOT/incoming' '$DEPLOY_ROOT/releases'"

      - name: Upload release over SFTP
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$RELEASE_ID.tar.gz"
          remote_archive="$DEPLOY_ROOT/incoming/$RELEASE_ID.tar.gz"
          batch_file="$RUNNER_TEMP/sftp-batch"
          printf 'put "%s" "%s"\n' "$archive" "$remote_archive" > "$batch_file"
          printf 'put "%s" "%s"\n' "$archive.sha256" "$remote_archive.sha256" >> "$batch_file"

          sftp \
            -b "$batch_file" \
            -i "$RUNNER_TEMP/deploy-ssh/private_key" \
            -P "$SFTP_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts" \
            "$SFTP_USER@$SFTP_HOST"

      - name: Activate release and reload PM2
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$RUNNER_TEMP/deploy-ssh/private_key"
            -p "$SFTP_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts"
          )

          ssh "${ssh_options[@]}" "$SFTP_USER@$SFTP_HOST" \
            bash -s -- \
            "$DEPLOY_ROOT" "$RELEASE_ID" "$REMOTE_NODE_BIN" \
            "$PM2_APP_NAME" "$HEALTHCHECK_URL" <<'REMOTE_SCRIPT'
          set -euo pipefail

          deploy_root=$1
          release_id=$2
          node_bin=$3
          pm2_app_name=$4
          healthcheck_url=$5

          archive="$deploy_root/incoming/$release_id.tar.gz"
          checksum="$archive.sha256"
          release_dir="$deploy_root/releases/$release_id"
          shared_env="$deploy_root/shared/.env.production"
          current_link="$deploy_root/current"

          [[ "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ -f "$archive" && -f "$checksum" ]]
          [[ -f "$shared_env" ]]
          [[ -L "$current_link" ]]
          [[ ! -e "$release_dir" ]]

          expected_checksum=$(tr -d '[:space:]' < "$checksum")
          actual_checksum=$(sha256sum "$archive" | awk '{print $1}')
          [[ "$actual_checksum" == "$expected_checksum" ]]

          mkdir "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          ln -s "$shared_env" "$release_dir/.env.production"
          git_sha=${release_id%%-*}
          printf '{"releaseId":"%s","gitSha":"%s"}\n' \
            "$release_id" "$git_sha" > "$release_dir/.release.json"

          export PATH="$node_bin:$PATH"
          command -v node >/dev/null
          command -v pm2 >/dev/null
          command -v curl >/dev/null
          pm2 describe "$pm2_app_name" >/dev/null

          cd "$release_dir"
          required_node_version=$(tr -d '[:space:]' < .nvmrc)
          actual_node_version=$(node --version)
          if [[ "$actual_node_version" != "v$required_node_version" ]]; then
            echo "REMOTE_NODE_BIN provides $actual_node_version; expected v$required_node_version" >&2
            exit 1
          fi
          if [[ "$(uname -s)" != "Linux" || "$(uname -m)" != "x86_64" ]]; then
            echo "Release dependencies require a Linux x86_64 host" >&2
            exit 1
          fi
          node -e '
            const fs = require("node:fs")
            const inputs = JSON.parse(fs.readFileSync(".release-inputs.json", "utf8"))
            if (inputs.monorepoCommit !== process.argv[1]) process.exit(1)
          ' "$git_sha"
          node -e "import('sharp')"
          node --check src/lpubeltsApiServer.js

          previous_release=$(readlink "$current_link")

          switch_current() {
            target=$1
            next_link="$deploy_root/.current-$release_id-next"
            ln -s "$target" "$next_link"
            mv -Tf "$next_link" "$current_link"
          }

          rollback() {
            echo "Deployment failed; restoring $previous_release" >&2
            switch_current "$previous_release"
            pm2 reload "$pm2_app_name" || true
          }

          switch_current "$release_dir"
          if ! pm2 reload "$pm2_app_name"; then
            rollback
            exit 1
          fi

          health_response=''
          if ! health_response=$(curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            "$healthcheck_url"); then
            rollback
            exit 1
          fi

          if ! node -e '
            const payload = JSON.parse(process.argv[2])
            if (payload.ready !== true || payload.releaseId !== process.argv[1]) process.exit(1)
          ' "$release_id" "$health_response"; then
            echo "Readiness response did not identify release $release_id" >&2
            rollback
            exit 1
          fi

          public_smoke_url="${healthcheck_url%/ready}/api/v1/stats/collections/locks"
          if ! curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 2 \
            "$public_smoke_url" >/dev/null; then
            echo "Public collection-statistics smoke check failed" >&2
            rollback
            exit 1
          fi

          rm -f "$archive" "$checksum"
          echo "Activated release $release_id"
          REMOTE_SCRIPT
