name: PR Check

on:
  pull_request:

jobs:
  deploy:
    name: PR Check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint, Test, and Build
        run: npm run ci-pr
